[project]
name = "agentsmith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "docker>=7.2.0",
]

[project.scripts]
sandbox = "sandbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
]
